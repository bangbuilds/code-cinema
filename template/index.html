<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>code-cinema</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050505;
        color: #ddd;
        font: 13px/1.4 -apple-system, 'PingFang SC', sans-serif;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0 0 44px 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #c {
        height: 100%;
        aspect-ratio: 9 / 16;
        max-width: 100%;
        background: #000;
        display: block;
      }
      #ui {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 44px;
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 0 14px;
        background: #111;
        border-top: 1px solid #222;
      }
      #ui input[type='range'] {
        flex: 1;
      }
      #ui button,
      #ui select {
        background: #222;
        color: #eee;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 4px 10px;
      }
      #time {
        width: 56px;
        font-variant-numeric: tabular-nums;
      }
      body.export #ui {
        display: none;
      }
      body.export #stage {
        inset: 0;
        display: block;
      }
      body.export #c {
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="c"></canvas></div>
    <div id="ui">
      <button id="play">▶</button>
      <input id="scrub" type="range" min="0" max="10" step="0.0166667" value="0" />
      <span id="time">0.00s</span>
      <select id="res">
        <option value="0.5">预览 540p</option>
        <option value="1">全分辨率</option>
      </select>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
